<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>ScoreSync Icon Generator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#060e1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; font-family:sans-serif; color:#fff; padding:24px; }
canvas { box-shadow:0 8px 40px rgba(0,0,0,0.6); border-radius:24%; }
.btn { padding:14px 32px; background:linear-gradient(135deg,#059669,#10b981); color:#fff; border:none; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; }
p { font-size:12px; color:#475569; text-align:center; max-width:300px; }
label { font-size:13px; color:#94a3b8; }
input[type=range] { width:200px; }
</style>
</head>
<body>
<p style="color:#34d399;font-weight:700;font-size:15px">PWA Icon Generator</p>

<div style="display:flex;gap:12px;align-items:center">
  <label>Zoom: <span id="zv">1.0</span>x</label>
  <input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1.0" oninput="redraw()"/>
</div>
<div style="display:flex;gap:12px;align-items:center">
  <label>Y offset: <span id="yv">0</span>px</label>
  <input type="range" id="yoff" min="-100" max="100" step="2" value="0" oninput="redraw()"/>
</div>

<canvas id="c" width="512" height="512"></canvas>
<button class="btn" onclick="dl()">⬇ Download icon-512.png</button>
<p>Adjust zoom & position, then download. Save as <strong>scoresync-logo.png</strong> in public/ and push.</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = 512;
const img = new Image();
img.crossOrigin = 'anonymous';
img.src = '/scoresync-logo.png?' + Date.now();
img.onload = redraw;

function redraw() {
  const zoom = parseFloat(document.getElementById('zoom').value);
  const yoff = parseInt(document.getElementById('yoff').value);
  document.getElementById('zv').textContent = zoom.toFixed(2);
  document.getElementById('yv').textContent = yoff;

  ctx.clearRect(0, 0, S, S);

  // Fill entire square with dark navy — NO white background
  ctx.fillStyle = '#0d1f35';
  ctx.fillRect(0, 0, S, S);

  // Draw image centered with zoom
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const ar = iw / ih;
  let dw = S * zoom, dh = (S / ar) * zoom;
  const dx = (S - dw) / 2;
  const dy = (S - dh) / 2 + yoff;
  ctx.drawImage(img, dx, dy, dw, dh);
}

function dl() {
  const a = document.createElement('a');
  a.download = 'icon-512.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
