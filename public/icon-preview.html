<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Generate App Icon</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; font-family:sans-serif; color:#fff; }
canvas { border-radius:22.5%; box-shadow:0 8px 40px rgba(0,0,0,0.6); }
button { padding:14px 32px; background:#10b981; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
p { font-size:13px; color:#64748b; text-align:center; max-width:300px; }
</style>
</head>
<body>
<p>ScoreSync App Icon Generator</p>
<canvas id="c" width="512" height="512"></canvas>
<button onclick="download()">⬇ Download icon-512.png</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const img = new Image();
img.crossOrigin = 'anonymous';
img.src = '/scoresync-logo.png?' + Date.now();
img.onload = function() {
  // Dark navy background fills whole square
  ctx.fillStyle = '#0d1f35';
  ctx.fillRect(0, 0, 512, 512);

  // Calculate image dimensions to fit logo centered with padding
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const aspect = iw / ih;

  // Fit inside 512x512 with 20px padding all around
  const pad = 20;
  const maxSize = 512 - pad * 2;
  let drawW, drawH;
  if (aspect >= 1) { drawW = maxSize; drawH = maxSize / aspect; }
  else             { drawH = maxSize; drawW = maxSize * aspect; }

  const x = (512 - drawW) / 2;
  const y = (512 - drawH) / 2;

  ctx.drawImage(img, x, y, drawW, drawH);
};
img.onerror = function() {
  ctx.fillStyle = '#0d1f35';
  ctx.fillRect(0, 0, 512, 512);
  ctx.font = 'bold 280px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(256, 80, 256, 430);
  g.addColorStop(0, '#3b82f6');
  g.addColorStop(1, '#10b981');
  ctx.fillStyle = g;
  ctx.fillText('S', 256, 270);
};

function download() {
  const a = document.createElement('a');
  a.download = 'icon-512.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
