<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Generate App Icon</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; font-family:sans-serif; color:#fff; }
canvas { border-radius:22.5%; box-shadow:0 8px 40px rgba(0,0,0,0.6); }
button { padding:14px 32px; background:#10b981; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
p { font-size:13px; color:#64748b; text-align:center; max-width:300px; }
</style>
</head>
<body>
<p>ScoreSync App Icon Generator</p>
<canvas id="c" width="512" height="512"></canvas>
<button onclick="download()">⬇ Download icon-512.png</button>
<p>After downloading, replace public/scoresync-logo.png with this file and push to deploy.</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const img = new Image();
img.crossOrigin = 'anonymous';
img.src = '/scoresync-logo.png?' + Date.now();
img.onload = function() {
  // Dark navy background
  ctx.fillStyle = '#0d1f35';
  ctx.fillRect(0, 0, 512, 512);

  // Draw logo centered and scaled up to fill
  // The logo emblem is centered in the image, so we zoom in
  const scale = 1.5;
  const size = 512 * scale;
  const offset = (512 - size) / 2;
  ctx.drawImage(img, offset, offset, size, size);

  // Optional: subtle teal border ring
  ctx.beginPath();
  ctx.arc(256, 256, 250, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(20,184,166,0.6)';
  ctx.lineWidth = 8;
  ctx.stroke();
};
img.onerror = function() {
  // Fallback: draw letter S
  ctx.fillStyle = '#0d1f35';
  ctx.fillRect(0, 0, 512, 512);
  ctx.font = 'bold 280px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(256, 80, 256, 430);
  g.addColorStop(0, '#3b82f6');
  g.addColorStop(1, '#10b981');
  ctx.fillStyle = g;
  ctx.fillText('S', 256, 270);
  ctx.font = 'bold 42px Arial';
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('SCORESYNC', 256, 420);
};

function download() {
  const a = document.createElement('a');
  a.download = 'icon-512.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
