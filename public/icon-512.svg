<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background square -->
  <rect width="512" height="512" fill="#0a1628"/>
  
  <!-- Outer teal ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#14b8a6" stroke-width="12"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="3"/>
  
  <!-- Inner circle bg -->
  <circle cx="256" cy="256" r="218" fill="#0d1f35"/>
  
  <!-- Embedded logo image -->
  <image href="/scoresync-logo.png" x="36" y="36" width="440" height="440" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid meet"/>
  
  <defs>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="218"/>
    </clipPath>
  </defs>
</svg>
