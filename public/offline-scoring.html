<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Offline Scoring — ScoreSync</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#060b18;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{background:rgba(6,11,24,0.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);padding:10px 16px;flex-shrink:0;position:sticky;top:0;z-index:50}
#topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
#event-name{font-weight:900;font-size:14px;color:#e2e8f0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#judge-info{font-size:11px;color:#475569}
#progress-bar-wrap{height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
#progress-bar{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:99px;transition:width 0.4s ease;width:0%}

/* ── Nav dots ── */
#nav-dots{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;scrollbar-width:none}
#nav-dots::-webkit-scrollbar{display:none}
.nav-dot{min-width:32px;height:32px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#475569;cursor:pointer;flex-shrink:0;transition:all 0.15s}
.nav-dot.active{background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.5);color:#a5b4fc}
.nav-dot.done{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.35);color:#6ee7b7}

/* ── Offline banner ── */
#offline-strip{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;flex-shrink:0;cursor:pointer}
#offline-strip.online{background:rgba(16,185,129,0.06);border-bottom:1px solid rgba(16,185,129,0.15)}
#offline-strip.offline{background:rgba(245,158,11,0.08);border-bottom:1px solid rgba(245,158,11,0.2)}
#offline-strip.nosignal{background:rgba(239,68,68,0.08);border-bottom:1px solid rgba(239,68,68,0.2)}
.strip-left{display:flex;align-items:center;gap:10px}
.strip-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.strip-text{font-size:12px;font-weight:700}
.strip-sub{font-size:11px;color:#475569;margin-top:1px}
.toggle-switch{width:44px;height:24px;border-radius:999px;position:relative;flex-shrink:0;transition:background 0.2s;cursor:pointer;border:1px solid rgba(255,255,255,0.1)}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#475569;transition:all 0.2s}
.toggle-switch.on{background:#f59e0b}
.toggle-switch.on .toggle-knob{transform:translateX(20px);background:#fff}
.toggle-switch.nosignal{background:#ef4444}
.toggle-switch.nosignal .toggle-knob{transform:translateX(20px);background:#fff}

/* ── Scoring panels ── */
#panels{flex:1;overflow-y:auto;padding-bottom:100px}
.panel{display:none;padding:16px}
.panel.active{display:block}

.contestant-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px}
.contestant-photo{width:52px;height:52px;border-radius:12px;object-fit:cover;border:2px solid rgba(99,102,241,0.3);background:linear-gradient(135deg,#1e3a8a,#4f46e5);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
.contestant-num{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#6366f1;margin-bottom:2px}
.contestant-name{font-size:18px;font-weight:900;color:#e2e8f0;line-height:1.2}
.contestant-sub{font-size:11px;color:#475569;margin-top:2px}
.contestant-total{text-align:right;flex-shrink:0}
.total-pct{font-size:22px;font-weight:900;color:#818cf8}
.total-label{font-size:10px;color:#374151;font-weight:700;text-transform:uppercase}

/* ── Criteria card ── */
.criteria-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;margin-bottom:12px;overflow:hidden}
.criteria-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.05)}
.criteria-name{font-size:14px;font-weight:800;color:#e2e8f0}
.criteria-weight{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;background:rgba(99,102,241,0.15);color:#a5b4fc;border:1px solid rgba(99,102,241,0.25)}
.criteria-desc{font-size:11px;color:#475569;padding:8px 14px 0;margin-bottom:-4px}

/* ── Numpad ── */
.numpad{padding:12px 14px}
.numpad-display{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.numpad-val{font-size:22px;font-weight:900;color:#e2e8f0}
.numpad-max{font-size:11px;color:#475569}
.numpad-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.np-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700;color:#94a3b8;cursor:pointer;transition:all 0.1s;text-align:center;-webkit-tap-highlight-color:transparent}
.np-btn:active,.np-btn.selected{background:rgba(99,102,241,0.25);border-color:rgba(99,102,241,0.5);color:#a5b4fc;transform:scale(0.95)}
.np-btn.selected{background:rgba(99,102,241,0.3);border-color:#6366f1;color:#c7d2fe}
.decimal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.dec-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;color:#64748b;cursor:pointer;transition:all 0.1s;text-align:center}
.dec-btn:active,.dec-btn.selected{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);color:#a5b4fc;transform:scale(0.95)}
.saved-badge{display:none;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(16,185,129,0.15);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3);margin-top:6px}

/* ── Submit button ── */
.submit-btn{width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:900;border:none;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s}
.submit-btn.ready{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(79,70,229,0.35)}
.submit-btn.done{background:rgba(16,185,129,0.15);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.submit-btn:active{transform:scale(0.98)}

/* ── Bottom toast ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;max-width:90vw;min-width:200px;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:opacity 0.3s;opacity:0;pointer-events:none;font-family:Inter,sans-serif}

/* ── No data screen ── */
#no-data{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;text-align:center}
.no-data-icon{font-size:4rem;margin-bottom:20px}
#no-data h2{font-size:1.3rem;font-weight:900;color:#f87171;margin-bottom:10px}
#no-data p{color:#64748b;font-size:.875rem;max-width:280px;line-height:1.6;margin-bottom:20px}
.go-back{color:#6ee7b7;font-weight:700;text-decoration:none;padding:10px 24px;border-radius:10px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);display:inline-block}

/* ── Pending sync banner ── */
#sync-banner{display:none;background:rgba(245,158,11,0.1);border-bottom:1px solid rgba(245,158,11,0.2);padding:8px 16px;font-size:11px;font-weight:700;color:#fcd34d;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-row1">
      <div>
        <div id="event-name">Loading...</div>
        <div id="judge-info"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <span id="scored-count" style="font-size:11px;font-weight:800;color:#6ee7b7"></span>
        <a href="javascript:history.back()" style="font-size:11px;font-weight:700;color:#64748b;text-decoration:none;padding:6px 10px;background:rgba(255,255,255,0.05);border-radius:8px;border:1px solid rgba(255,255,255,0.08)">← Back</a>
      </div>
    </div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>

  <!-- Pending sync banner -->
  <div id="sync-banner" onclick="trySyncNow()">📦 <span id="sync-count">0</span> score(s) pending sync — Tap to sync now</div>

  <!-- Offline toggle strip -->
  <div id="offline-strip" onclick="toggleOffline()">
    <div class="strip-left">
      <div class="strip-dot" id="strip-dot"></div>
      <div>
        <div class="strip-text" id="strip-text">Online</div>
        <div class="strip-sub" id="strip-sub">Tap to enable offline mode</div>
      </div>
    </div>
    <div class="toggle-switch" id="toggle-sw"><div class="toggle-knob"></div></div>
  </div>

  <!-- Nav dots -->
  <div id="nav-dots"></div>

  <!-- Panels -->
  <div id="panels">
    <div id="no-data">
      <div class="no-data-icon">📵</div>
      <h2>No Offline Data Found</h2>
      <p>You need to open the scoring page while online first. The data will be saved automatically for offline use.</p>
      <a class="go-back" href="javascript:history.back()">← Go Back</a>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── IndexedDB ─────────────────────────────────────────────────────────────────
var DB_NAME = 'scoresync-offline', DB_VER = 1, STORE = 'pending-scores';
var MANUAL_KEY = 'ss_offline_manual';

function openDB() {
  return new Promise(function(res, rej) {
    var r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
    };
    r.onsuccess = function(e) { res(e.target.result); };
    r.onerror   = function(e) { rej(e.target.error); };
  });
}
function savePending(url, scores) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(STORE,'readwrite');
      var r  = tx.objectStore(STORE).add({ url:url, scores:scores, savedAt:Date.now() });
      r.onsuccess = function() { res(r.result); };
      r.onerror   = function(e) { rej(e.target.error); };
    });
  });
}
function getPending() {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(STORE,'readonly');
      var r  = tx.objectStore(STORE).getAll();
      r.onsuccess = function() { res(r.result); };
      r.onerror   = function(e) { rej(e.target.error); };
    });
  });
}
function deletePending(id) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(STORE,'readwrite');
      var r  = tx.objectStore(STORE).delete(id);
      r.onsuccess = function() { res(); };
      r.onerror   = function(e) { rej(e.target.error); };
    });
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────────
var toastTimer;
function toast(msg, type, persist) {
  var el = document.getElementById('toast');
  var bg = { info:'rgba(15,23,42,0.97)', success:'rgba(6,78,59,0.97)', warning:'rgba(78,37,0,0.97)', error:'rgba(127,29,29,0.97)' };
  var cl = { info:'#93c5fd', success:'#6ee7b7', warning:'#fcd34d', error:'#fca5a5' };
  el.style.background = bg[type] || bg.info;
  el.style.color      = cl[type] || cl.info;
  el.style.border     = '1px solid ' + (cl[type] || cl.info).replace(')', ',0.4)').replace('rgb','rgba');
  el.textContent      = msg;
  el.style.opacity    = '1';
  clearTimeout(toastTimer);
  if (!persist) toastTimer = setTimeout(function() { el.style.opacity = '0'; }, 3000);
}

// ── Offline toggle ────────────────────────────────────────────────────────────
function isOffline() { return !navigator.onLine || localStorage.getItem(MANUAL_KEY) === '1'; }

function updateStrip() {
  var manual   = localStorage.getItem(MANUAL_KEY) === '1';
  var noSignal = !navigator.onLine;
  var strip    = document.getElementById('offline-strip');
  var dot      = document.getElementById('strip-dot');
  var text     = document.getElementById('strip-text');
  var sub      = document.getElementById('strip-sub');
  var sw       = document.getElementById('toggle-sw');

  strip.className = noSignal ? 'nosignal' : (manual ? 'offline' : 'online');
  sw.className    = 'toggle-switch ' + (noSignal ? 'nosignal' : (manual ? 'on' : ''));

  if (noSignal) {
    dot.style.background  = '#f87171';
    dot.style.boxShadow   = '0 0 6px #ef4444';
    text.textContent      = '📵 No Signal — Offline Mode Active';
    sub.textContent       = 'Scores saved to device automatically';
    sub.style.color       = '#fca5a5';
  } else if (manual) {
    dot.style.background  = '#fbbf24';
    dot.style.boxShadow   = '0 0 6px #f59e0b';
    text.textContent      = '✈ Offline Mode ON';
    sub.textContent       = 'Tap to go online and sync scores';
    sub.style.color       = '#fcd34d';
  } else {
    dot.style.background  = '#34d399';
    dot.style.boxShadow   = '0 0 6px #10b981';
    text.textContent      = '🌐 Online';
    sub.textContent       = 'Tap to enable offline mode';
    sub.style.color       = '#475569';
  }

  getPending().then(function(items) {
    var sb = document.getElementById('sync-banner');
    var sc = document.getElementById('sync-count');
    if (items.length > 0) {
      sc.textContent   = items.length;
      sb.style.display = 'block';
    } else {
      sb.style.display = 'none';
    }
  }).catch(function() {});
}

function toggleOffline() {
  if (!navigator.onLine) {
    toast('📵 No internet — already in offline mode', 'warning', false);
    return;
  }
  if (localStorage.getItem(MANUAL_KEY) === '1') {
    localStorage.removeItem(MANUAL_KEY);
    toast('🌐 Online mode restored. Syncing...', 'success', false);
    updateStrip();
    setTimeout(trySyncNow, 400);
  } else {
    localStorage.setItem(MANUAL_KEY, '1');
    toast('✈ Offline mode ON — scores saved to device', 'warning', true);
    updateStrip();
  }
}

// ── Sync ──────────────────────────────────────────────────────────────────────
function trySyncNow() {
  if (!navigator.onLine) { toast('No internet — cannot sync yet', 'warning', false); return; }
  getPending().then(function(pending) {
    if (!pending.length) { toast('Nothing to sync', 'info', false); updateStrip(); return; }
    toast('Syncing ' + pending.length + ' score(s)...', 'info', false);
    var done=0, ok=0, fail=0, total=pending.length;
    pending.forEach(function(item) {
      var body = new URLSearchParams();
      Object.keys(item.scores).forEach(function(k) { body.append(k, item.scores[k]); });
      // Get fresh CSRF from meta tag if available
      var meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) body.append('_csrf', meta.content);
      fetch(item.url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body.toString(), credentials:'same-origin' })
        .then(function(r) {
          if (r.ok || r.redirected || r.status < 400) { return deletePending(item.id).then(function(){ ok++; check(); }); }
          else { fail++; check(); }
        }).catch(function() { fail++; check(); });
    });
    function check() {
      done++;
      if (done < total) return;
      if (ok > 0 && fail === 0) toast('✓ ' + ok + ' score(s) synced!', 'success', false);
      else if (ok > 0) toast('✓ ' + ok + ' synced, ' + fail + ' failed', 'warning', false);
      else toast('Sync failed — will retry later', 'error', false);
      updateStrip();
    }
  });
}

// ── Score state ───────────────────────────────────────────────────────────────
var scoreState = {}; // { contestantId: { criteriaId: value } }
var savedState = {}; // which contestants are submitted

function getScore(cid, crId) { return (scoreState[cid] && scoreState[cid][crId]) || 0; }
function setScore(cid, crId, val) {
  if (!scoreState[cid]) scoreState[cid] = {};
  scoreState[cid][crId] = val;
  updateTotals(cid);
  updateNavDot(cid);
}

function updateTotals(cid) {
  var data = window.scoringData;
  if (!data) return;
  var c = data.contestants.find(function(x) { return x.id === cid; });
  if (!c) return;
  var total = 0;
  c.criteria.forEach(function(cr) {
    var s = parseFloat(getScore(cid, cr.criteriaId)) || 0;
    total += (s / parseFloat(cr.maxScore)) * parseFloat(cr.weight);
  });
  var el = document.getElementById('total-' + cid);
  if (el) el.textContent = total.toFixed(2) + '%';

  // Update progress
  var scored = Object.keys(savedState).length;
  var pct = data.contestants.length ? (scored / data.contestants.length * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('scored-count').textContent = scored + '/' + data.contestants.length + ' scored';
}

function updateNavDot(cid) {
  var data = window.scoringData;
  if (!data) return;
  var c = data.contestants.find(function(x) { return x.id === cid; });
  if (!c) return;
  // Check if all criteria filled
  var allFilled = c.criteria.every(function(cr) { return parseFloat(getScore(cid, cr.criteriaId)) > 0; });
  var dot = document.querySelector('.nav-dot[data-cid="' + cid + '"]');
  if (!dot) return;
  if (savedState[cid]) { dot.className = 'nav-dot done'; }
  else if (allFilled)  { dot.className = 'nav-dot active'; }
}

// ── Build UI ──────────────────────────────────────────────────────────────────
var currentIdx = 0;

function goTo(idx) {
  currentIdx = idx;
  document.querySelectorAll('.panel').forEach(function(p, i) {
    p.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.nav-dot').forEach(function(d, i) {
    if (parseInt(d.dataset.idx) === idx && !d.classList.contains('done')) d.classList.add('active');
  });
  // Scroll nav dot into view
  var dot = document.querySelector('.nav-dot[data-idx="' + idx + '"]');
  if (dot) dot.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

function buildUI(data) {
  window.scoringData = data;
  document.getElementById('event-name').textContent = data.eventName;
  document.getElementById('judge-info').textContent = 'Judge: ' + data.judgeName;
  document.getElementById('no-data').style.display = 'none';

  var navEl    = document.getElementById('nav-dots');
  var panelsEl = document.getElementById('panels');
  navEl.innerHTML = '';
  panelsEl.innerHTML = '';

  data.contestants.forEach(function(c, cidx) {
    // Nav dot
    var dot = document.createElement('button');
    dot.className        = 'nav-dot' + (cidx === 0 ? ' active' : '');
    dot.textContent      = c.number || (cidx + 1);
    dot.dataset.idx      = cidx;
    dot.dataset.cid      = c.id;
    dot.onclick          = function() { goTo(cidx); };
    navEl.appendChild(dot);

    // Panel
    var panel = document.createElement('div');
    panel.className = 'panel' + (cidx === 0 ? ' active' : '');

    // Contestant header
    var photoHtml = c.photo
      ? '<img src="' + c.photo + '" class="contestant-photo" style="object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        + '<div class="contestant-photo" style="display:none">' + (c.number || cidx+1) + '</div>'
      : '<div class="contestant-photo">' + (c.number || cidx+1) + '</div>';

    panel.innerHTML = '<div class="contestant-header">'
      + photoHtml
      + '<div style="flex:1;min-width:0">'
      + '<div class="contestant-num">Contestant #' + (c.number || cidx+1) + '</div>'
      + '<div class="contestant-name">' + c.name + '</div>'
      + (c.barangay ? '<div class="contestant-sub">Brgy. ' + c.barangay + '</div>' : '')
      + '</div>'
      + '<div class="contestant-total"><div class="total-pct" id="total-' + c.id + '">0.00%</div><div class="total-label">total</div></div>'
      + '</div>';

    // Criteria cards
    c.criteria.forEach(function(cr) {
      var card = document.createElement('div');
      card.className = 'criteria-card';
      var max = parseFloat(cr.maxScore) || 100;
      var integers = [];
      for (var i = 0; i <= max; i++) integers.push(i);

      // Build numpad rows (0-9 in rows of 5 if max<=10, else show key values)
      var numBtns = '';
      var shown   = max <= 20 ? max : 10;
      for (var v = 0; v <= shown; v++) {
        numBtns += '<button class="np-btn" data-cid="' + c.id + '" data-crid="' + cr.criteriaId + '" data-val="' + v + '" onclick="selectNum(this,' + v + ',\'' + c.id + '\',\'' + cr.criteriaId + '\')">' + v + '</button>';
      }

      // Decimal buttons
      var decBtns = ['.25','.50','.75'].map(function(d) {
        return '<button class="dec-btn" data-cid="' + c.id + '" data-crid="' + cr.criteriaId + '" data-dec="' + d + '" onclick="selectDec(this,\'' + d + '\',\'' + c.id + '\',\'' + cr.criteriaId + '\')">' + d + '</button>';
      }).join('');

      card.innerHTML = '<div class="criteria-header">'
        + '<div class="criteria-name">' + cr.criteriaName + '</div>'
        + '<span class="criteria-weight">' + cr.weight + '%</span>'
        + '</div>'
        + (cr.description ? '<div class="criteria-desc">' + cr.description + '</div>' : '')
        + '<div class="numpad">'
        + '<div class="numpad-display"><span class="numpad-val" id="val-' + c.id + '-' + cr.criteriaId + '">—</span><span class="numpad-max">Max: ' + max + '</span></div>'
        + '<div class="numpad-grid">' + numBtns + '</div>'
        + '<div class="decimal-row">' + decBtns + '</div>'
        + '</div>';
      panel.appendChild(card);
    });

    // Submit button
    var submitBtn = document.createElement('button');
    submitBtn.className   = 'submit-btn ready';
    submitBtn.id          = 'submit-' + c.id;
    submitBtn.innerHTML   = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
      + (cidx < data.contestants.length - 1 ? 'Save & Next Contestant →' : 'Save & Finish ✓');
    submitBtn.onclick = function() { submitContestant(c.id, cidx); };
    panel.appendChild(submitBtn);

    panelsEl.appendChild(panel);
  });
}

// ── Score selection ───────────────────────────────────────────────────────────
function selectNum(btn, val, cid, crId) {
  // Remove selection from other integer buttons for this criteria
  document.querySelectorAll('.np-btn[data-cid="' + cid + '"][data-crid="' + crId + '"]').forEach(function(b) { b.classList.remove('selected'); });
  // Remove decimal selection
  document.querySelectorAll('.dec-btn[data-cid="' + cid + '"][data-crid="' + crId + '"]').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  setScore(cid, crId, val);
  document.getElementById('val-' + cid + '-' + crId).textContent = val;
}

function selectDec(btn, dec, cid, crId) {
  // Get current integer
  var current = Math.floor(parseFloat(getScore(cid, crId)) || 0);
  var newVal   = current + parseFloat(dec);
  // Deselect other decimals
  document.querySelectorAll('.dec-btn[data-cid="' + cid + '"][data-crid="' + crId + '"]').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  setScore(cid, crId, newVal);
  document.getElementById('val-' + cid + '-' + crId).textContent = newVal.toFixed(2);
}

// ── Submit contestant ─────────────────────────────────────────────────────────
function submitContestant(cid, cidx) {
  var data = window.scoringData;
  var c    = data.contestants.find(function(x) { return x.id === cid; });
  if (!c) return;

  // Build scores object matching the server's expected format
  var scores = {};
  c.criteria.forEach(function(cr) {
    var s = getScore(cid, cr.criteriaId);
    scores[cr.inputName] = s;
  });

  var doSave = function() {
    if (isOffline()) {
      // Save to IndexedDB
      savePending(data.formAction, scores).then(function() {
        savedState[cid] = true;
        markDone(cid, cidx);
        toast('📦 Saved offline! Will sync when online.', 'warning', false);
      }).catch(function() {
        toast('Could not save — storage may be full', 'error', false);
      });
    } else {
      // Submit directly to server
      var body = new URLSearchParams();
      Object.keys(scores).forEach(function(k) { body.append(k, scores[k]); });
      // Try to get CSRF token
      var meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) body.append('_csrf', meta.content);
      toast('Submitting...', 'info', false);
      fetch(data.formAction, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body.toString(), credentials:'same-origin' })
        .then(function(r) {
          if (r.ok || r.redirected || r.status < 400) {
            savedState[cid] = true;
            markDone(cid, cidx);
            toast('✓ Scores submitted!', 'success', false);
          } else {
            toast('Submit failed — saved offline instead', 'warning', false);
            savePending(data.formAction, scores).then(function() {
              savedState[cid] = true;
              markDone(cid, cidx);
            });
          }
        }).catch(function() {
          toast('No connection — saved offline', 'warning', false);
          savePending(data.formAction, scores).then(function() {
            savedState[cid] = true;
            markDone(cid, cidx);
          });
        });
    }
  };

  // Check if all criteria filled
  var empty = c.criteria.filter(function(cr) { return !parseFloat(getScore(cid, cr.criteriaId)); });
  if (empty.length > 0) {
    if (!confirm(empty.length + ' criteria have no score. Submit anyway?')) return;
  }
  doSave();
}

function markDone(cid, cidx) {
  var btn = document.getElementById('submit-' + cid);
  if (btn) { btn.className = 'submit-btn done'; btn.innerHTML = '✓ Saved'; }
  var dot = document.querySelector('.nav-dot[data-cid="' + cid + '"]');
  if (dot) dot.className = 'nav-dot done';
  updateTotals(cid);
  // Auto advance to next contestant
  var data = window.scoringData;
  if (data && cidx < data.contestants.length - 1) {
    setTimeout(function() { goTo(cidx + 1); }, 800);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  updateStrip();

  // Check sync pending on load
  getPending().then(function(items) {
    if (items.length > 0 && navigator.onLine && localStorage.getItem(MANUAL_KEY) !== '1') {
      setTimeout(trySyncNow, 1000);
    }
    updateStrip();
  });

  // Load data from localStorage
  try {
    var raw = localStorage.getItem('ss_offline_scoring_data');
    if (!raw) { document.getElementById('no-data').style.display = 'flex'; return; }
    var data = JSON.parse(raw);
    if (!data.contestants || !data.contestants.length) {
      document.getElementById('no-data').style.display = 'flex';
      return;
    }
    buildUI(data);
    goTo(0);
  } catch(e) {
    document.getElementById('no-data').style.display = 'flex';
  }

  window.addEventListener('online',  function() { updateStrip(); if (localStorage.getItem(MANUAL_KEY) !== '1') setTimeout(trySyncNow, 600); });
  window.addEventListener('offline', function() { updateStrip(); toast('📵 No signal — offline mode active', 'warning', true); });
});
</script>
